<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -180 160 215">
  <!-- Same viewBox as parachute.svg, so the two images line up when stacked. -->
  <g stroke-linecap="round" fill="none">
    <!-- scarf -->
    <path d="M -4 -7 Q -20 -6 -34 -12 Q -28 -3 -36 4 Q -18 2 -2 -1 Z" fill="#e11d48" stroke="#4a2511" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- legs -->
    <path d="M -7 14 L -10 28 M 7 14 L 10 28" stroke="#4a2511" stroke-width="10"/>
    <path d="M -7 14 L -10 28 M 7 14 L 10 28" stroke="#f59e42" stroke-width="5.5"/>
    <!-- arms holding the lines -->
    <path d="M -11 -2 L -22 -38 M 11 -2 L 22 -38" stroke="#4a2511" stroke-width="10"/>
    <path d="M -11 -2 L -22 -38 M 11 -2 L 22 -38" stroke="#f59e42" stroke-width="5.5"/>
  </g>
  <!-- body -->
  <ellipse cx="0" cy="6" rx="15" ry="16" fill="#f59e42" stroke="#4a2511" stroke-width="3"/>
  <ellipse cx="0" cy="9" rx="8" ry="10" fill="#ffe3c2"/>
  <path d="M -6 -7 Q 0 -3 6 -7 L 7 -3 Q 0 1 -7 -3 Z" fill="#e11d48" stroke="#4a2511" stroke-width="2" stroke-linejoin="round"/>
  <!-- ears -->
  <path d="M -17 -30 L -15 -49 L -2 -40 Z M 17 -30 L 15 -49 L 2 -40 Z" fill="#f59e42" stroke="#4a2511" stroke-width="3" stroke-linejoin="round"/>
  <path d="M -13 -34 L -13 -43 L -7 -39 Z M 13 -34 L 13 -43 L 7 -39 Z" fill="#ffb4a8"/>
  <!-- head -->
  <circle cx="0" cy="-24" r="18" fill="#f59e42" stroke="#4a2511" stroke-width="3"/>
  <path d="M -9 -40 Q -6 -34 -9 -29 M 0 -42 Q 3 -36 0 -30 M 9 -40 Q 6 -34 9 -29" stroke="#d9772a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="0" cy="-15" rx="8.5" ry="6" fill="#ffe3c2"/>
  <path d="M -2.5 -19 L 2.5 -19 L 0 -16.5 Z" fill="#4a2511" stroke="#4a2511" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M -4 -13.5 Q 0 -9.5 4 -13.5" stroke="#4a2511" fill="none" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-6.5" cy="-23" r="2.6" fill="#4a2511"/>
  <circle cx="6.5" cy="-23" r="2.6" fill="#4a2511"/>
  <circle cx="-5.7" cy="-23.8" r="0.9" fill="#fff"/>
  <circle cx="7.3" cy="-23.8" r="0.9" fill="#fff"/>
  <path d="M -9 -16 L -19 -18 M -9 -14 L -19 -13 M 9 -16 L 19 -18 M 9 -14 L 19 -13" stroke="#4a2511" stroke-width="1.2" stroke-linecap="round"/>
  <!-- goggles -->
  <path d="M -18 -31 Q 0 -35 18 -31" stroke="#334155" stroke-width="4" fill="none"/>
  <circle cx="-7.5" cy="-32" r="6.5" fill="#bae6fd" stroke="#334155" stroke-width="3"/>
  <circle cx="7.5" cy="-32" r="6.5" fill="#bae6fd" stroke="#334155" stroke-width="3"/>
  <path d="M -10 -34 L -7 -36 M 5 -34 L 8 -36" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
